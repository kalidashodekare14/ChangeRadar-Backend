name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # The generated client is git-ignored; prisma.config.ts validates this
      # variable even though `prisma generate` never connects to the database.
      DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/changeradar?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:circular
      - run: npm run check:forbidden
      - run: npm test -- --runInBand
      - run: npm run build
      # Runtime advisories only; dev-only advisories are revisited in Phase 12.
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: changeradar
          POSTGRES_USER: changeradar
          POSTGRES_PASSWORD: changeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeradar -d changeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      BOOTSTRAP_DATABASE_URL: postgresql://changeradar:changeradar@localhost:5432/changeradar?schema=public
      DIRECT_DATABASE_URL: postgresql://changeradar_migrator:ci-migrator@localhost:5432/changeradar?schema=public
      DATABASE_URL: postgresql://changeradar_app:ci-app@localhost:5432/changeradar?schema=public
      MIGRATOR_PASSWORD: ci-migrator
      APP_PASSWORD: ci-app
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # Release order: roles -> Prisma Migrate on an empty DB -> manual SQL.
      - run: npm run db:roles
      - run: npm run db:migrate:deploy
      - run: npm run db:manual
      - run: npm test -- --runInBand test/isolation
      - run: npm test -- --runInBand auth.e2e.spec
      - run: npm run build
