name: changeradar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changeradar}
      POSTGRES_USER: ${POSTGRES_USER:-changeradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeradar}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-changeradar} -d ${POSTGRES_DB:-changeradar}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  storage-permissions:
    image: alpine:3.22
    user: '0:0'
    command: ['sh', '-c', 'mkdir -p /data /logs && chown -R 10001:10001 /data /logs']
    volumes:
      - storage-data:/data
      - storage-logs:/logs

  storage:
    image: rustfs/rustfs:1.0.7
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
      - storage-logs:/logs
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  storage-init:
    image: amazon/aws-cli:2.42.4
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/scripts/init.sh']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-changeradar}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - ./scripts/storage:/scripts:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Container-internal endpoints override the host values from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-changeradar}:${POSTGRES_PASSWORD:-changeradar}@postgres:5432/${POSTGRES_DB:-changeradar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-changeradar}:${POSTGRES_PASSWORD:-changeradar}@postgres:5432/${POSTGRES_DB:-changeradar}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-changeradar}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.js']
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-changeradar}:${POSTGRES_PASSWORD:-changeradar}@postgres:5432/${POSTGRES_DB:-changeradar}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-changeradar}:${POSTGRES_PASSWORD:-changeradar}@postgres:5432/${POSTGRES_DB:-changeradar}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
  storage-logs:
