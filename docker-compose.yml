name: changeradar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changeradar}
      POSTGRES_USER: ${POSTGRES_USER:-changeradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeradar}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-changeradar} -d ${POSTGRES_DB:-changeradar}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  storage-permissions:
    image: alpine:3.22
    user: '0:0'
    command: ['sh', '-c', 'mkdir -p /data /logs && chown -R 10001:10001 /data /logs']
    volumes:
      - storage-data:/data
      - storage-logs:/logs

  storage:
    image: rustfs/rustfs:1.0.7
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
      - storage-logs:/logs
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  storage-init:
    image: amazon/aws-cli:2.42.4
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/scripts/init.sh']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-changeradar}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - ./scripts/storage:/scripts:ro

volumes:
  postgres-data:
  redis-data:
  storage-data:
  storage-logs:
